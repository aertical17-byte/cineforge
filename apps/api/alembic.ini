[alembic]
script_location = alembic
prepend_sys_path = .
entity = app

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formulas]
keys =

[formulas_keys]
keys =

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = simple

[formatters]
keys = simple

[formatter_simple]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
