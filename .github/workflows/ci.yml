name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · tests (Postgres + Redis sidecars)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cineforge
          POSTGRES_PASSWORD: cineforge
          POSTGRES_DB: cineforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cineforge" --health-interval 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install API deps
        run: pip install -r apps/api/requirements.txt -r apps/api/requirements-dev.txt
      - name: Critical-lint gate (syntax; undefined names only)
        run: pip install ruff && ruff check --select E9,F821 apps/api
      - name: Migration check (alembic upgrade head on Postgres)
        env:
          DATABASE_URL: postgresql+asyncpg://cineforge:cineforge@localhost:5432/cineforge
        run: cd apps/api && alembic upgrade head
      - name: Migration check (alembic upgrade head on SQLite path)
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/migcheck.db
        run: cd apps/api && alembic upgrade head
      - name: Unit and integration tests (test env, mock provider only)
        run: cd apps/api && python -m pytest -q

  web:
    name: Web · typecheck, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/web
        run: npx tsc --noEmit
      - name: Unit tests
        working-directory: apps/web
        run: npm run test
      - name: Production build (reprices into bundle)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  e2e:
    name: E2E · full user journey (mock provider, test env only)
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          pip install -r apps/api/requirements.txt
          (cd apps/web && npm install --no-audit --no-fund)
      - name: Install Playwright browsers
        run: (cd apps/e2e && npm install --no-audit --no-fund) && (cd apps/e2e && npx playwright install chromium --with-deps)
      - name: Start API (test env, mock engine)
        working-directory: apps/api
        env:
          ENVIRONMENT: test
          AI_MOCK_MODE: "1"
          DATABASE_URL: sqlite+aiosqlite:///./data/e2e.db
          ADMIN_EMAILS: admin@example.com
          CORS_ORIGINS: http://127.0.0.1:3000
        run: uvicorn app.main:app --host 127.0.0.1 --port 8000 &
      - name: Start worker loop (same env; production topology runs the worker as its own process)
        working-directory: apps/api
        env:
          ENVIRONMENT: test
          AI_MOCK_MODE: "1"
          DATABASE_URL: sqlite+aiosqlite:///./data/e2e.db
          ADMIN_EMAILS: admin@example.com
          CORS_ORIGINS: http://127.0.0.1:3000
        run: python -m app.worker_loop &
      - name: Start web dev server
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: npm run dev -- -p 3000 -H 127.0.0.1 &
      - name: Wait for services
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health && curl -sf http://127.0.0.1:3000 && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health
      - name: Run E2E journey
        working-directory: apps/e2e
        run: npx playwright test
      - name: Upload UI screenshots (for the public site)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-shots
          path: apps/e2e/shots
          if-no-files-found: ignore
      - name: Upload playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
      - name: Dump runtime state (always; worker log + DB inventory + process census)
        if: always()
        run: |
          set +e
          echo "== process census =="
          ps -eo pid,cmd | grep -E "worker_loop|uvicorn|next dev" | grep -v grep
          echo
          echo "== worker.log (tail) =="
          tail -n 80 apps/api/data/worker.log 2>/dev/null || echo "(no worker.log)"
          echo
          echo "== DB inventory =="
          python3 - <<'EOF'
          import json, os, sqlite3
          db = "apps/api/data/e2e.db"
          if not os.path.isfile(db):
              print("no e2e.db found at", os.path.abspath(db))
          else:
              con = sqlite3.connect(db, timeout=10)
              cur = con.cursor()
              for table in ("generations", "generation_jobs", "assets", "credit_transactions"):
                  try:
                      rows = cur.execute(f"select * from {table}").fetchall()
                      cols = [d[0] for d in cur.description]
                      print(table, json.dumps([dict(zip(cols, r)) for r in rows], default=str)[:4000])
                  except Exception as e:
                      print(table, "ERR", e)
          EOF

  docker:
    name: Containers build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file (deployment drift check)
        run: docker compose -f infra/docker/docker-compose.yml config -q
      - name: Build API image
        run: docker build -f infra/docker/Dockerfile.api -t cineforge-api:sha-${{ github.sha }} .
      - name: Build Worker image
        run: docker build -f infra/docker/Dockerfile.worker -t cineforge-worker:sha-${{ github.sha }} .
      - name: Build Web image
        run: docker build -f infra/docker/Dockerfile.web -t cineforge-web:sha-${{ github.sha }} .
