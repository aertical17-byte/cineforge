name: dmg

# Manual, on-demand: builds the macOS installer (launcher app + drag-to-Applications dmg)
# and optionally publishes it to GitHub Releases (public download for end users).
# macOS runners are billed for private repos — dispatch-only keeps costs at zero by default.
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish to GitHub Releases (public download)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build macOS .dmg (universal binary)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps (Pillow for assets, dmgbuild for the image)
        run: python3 -m pip install --quiet pillow dmgbuild
      - name: Build app bundle + dmg
        run: bash installer/mac/build.sh
      - name: Sanity-check the dmg (mount, app present, binary runs --help path check)
        run: |
          hdiutil attach dist/CineForge-AI.dmg -nobrowse -readonly -mountpoint /tmp/cfvol
          test -d "/tmp/cfvol/CineForge AI.app"
          test -x "/tmp/cfvol/CineForge AI.app/Contents/MacOS/CineForgeAI"
          test -f "/tmp/cfvol/README.txt"
          hdiutil detach /tmp/cfvol
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cineforge-dmg
          path: dist/CineForge-AI.dmg
          if-no-files-found: error
      - name: Publish to GitHub Releases
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.6.0 --yes --cleanup-tag 2>/dev/null || true
          gh release create v0.6.0 dist/CineForge-AI.dmg \
            --title "CineForge AI v0.6.0 — Mac installer (Light mode: no Docker needed)" \
            --latest \
            --notes "**New in v0.6.0 — Light mode: no Docker, no 6 GB, no setup.** Open the app and the Light Studio opens in your browser automatically (localhost:3000 redirects to the hosted studio). **Image generation is free** — the community engine (AI Horde) runs on volunteers' GPUs: no card, no signup, no API key, and it all happens client-side. The full room catalog is honestly labeled: what works free now vs. what needs your own engine key. **Full local mode** (optional, Docker Desktop required) still gives you the complete product: projects, Flowboard, local library, your own keys — first run 5–15 minutes. If macOS says the app cannot be opened: System Settings → Privacy & Security → **Open Anyway** (or in Terminal: \`xattr -dr com.apple.quarantine \"/Applications/CineForge AI.app\"\`). Guide: in the project (docs) and inside the app."
